<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Warkop Brmano</title>
<style>
  /* ORANGE AND WHITE THEME */
  :root {
    --bg: #ffffff;
    --card: #fff7ed;
    --text: #2a2a2a;
    --muted: #7a7a7a;
    --accent: #f97316;
    --accent-dark: #ea580c;
    --accent-soft: #ffedd5;
    --success: #2fa86b;
    --border: #fed7aa;
    --shadow: 0 4px 15px rgba(249, 115, 22, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px;}
  
  /* Header & Logo */
  header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
  .logo-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid var(--accent); }
  header h1 { font-size: 24px; color: var(--accent-dark); }
  header p { font-size: 14px; color: var(--muted); }

  /* Menu Items */
  .menu { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--card); border-radius: 12px; padding: 16px; display: flex; align-items: center; border: 1px solid var(--border); }
  .item-info { flex: 1; }
  .item-name { font-weight: 600; font-size: 16px; }
  .item-price { font-weight: 700; color: var(--accent); margin-top: 4px; }
  
  /* Buttons */
  .qty-controls { display: flex; align-items: center; gap: 12px; }
  .qty-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: bold; cursor: pointer; }
  .qty-btn.add { background: var(--accent); color: white; }
  .qty-num { font-weight: bold; min-width: 20px; text-align: center; }

  /* Bottom Cart Bar */
  .cart-bar { position: fixed; bottom: 0; width: 100%; padding: 16px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: center; }
  .checkout-btn { width: 100%; max-width: 400px; padding: 16px; background: var(--accent); color: white; font-weight: bold; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; }
  
  /* Order Overview Modal (Cart) */
  .modal { display: none; position: fixed; inset: 0; background: white; z-index: 50; flex-direction: column; }
  .modal.show { display: flex; }
  .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .close-btn { background: none; border: none; font-size: 24px; color: var(--accent); cursor: pointer; font-weight: bold;}
  .modal-content { padding: 20px; overflow-y: auto; flex: 1; }
  .confirm-btn { background: var(--success); color: white; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer;}
  
  /* Success Screen */
  .success-screen { display: none; position: fixed; inset: 0; background: white; z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;}
  .success-screen.show { display: flex; }
  .qr-img { width: 200px; height: 200px; margin: 20px 0; border-radius: 12px; border: 2px solid var(--accent); }
  .new-order-btn { margin-top: 20px; padding: 12px 24px; border: 2px solid var(--accent); background: white; color: var(--accent); border-radius: 12px; font-weight: bold; }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Warkop Brmano Logo" class="logo-img" onerror="this.style.display='none'">
  <h1>Warkop Brmano</h1>
  <p>Pilih menu favoritmu</p>
</header>

<div class="menu" id="menu"></div>

<div class="cart-bar" id="cartBar" style="display: none;">
  <button class="checkout-btn" id="viewCartBtn">
    <span id="cartCount">0 item</span>
    <span>Review Order</span>
    <span id="cartTotal">Rp0</span>
  </button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-header">
    <h2>Order Overview</h2>
    <button class="close-btn" id="closeCartBtn">X</button>
  </div>
  <div class="modal-content">
    <div id="cartItems"></div>
    <button class="confirm-btn" id="confirmOrderBtn">Send Order to Kitchen</button>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <h2 style="color: var(--success);">Pesanan Berhasil!</h2>
  <p>Silahkan scan QR di bawah ini untuk membayar.</p>
  <img id="qrImg" class="qr-img" alt="QR Code" />
  <h3 id="successTotal">Rp0</h3>
  <button class="new-order-btn" id="newOrderBtn">Buat Pesanan Baru</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // Firebase Config (Pre-filled for you)
  const firebaseConfig = {
    apiKey: "AIzaSyCmmIeOR8RA-PeGZGVttAcdwHuPveuXVVM",
    authDomain: "order-sekarang.firebaseapp.com",
    databaseURL: "https://order-sekarang-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "order-sekarang",
    storageBucket: "order-sekarang.firebasestorage.app",
    messagingSenderId: "559153338639",
    appId: "1:559153338639:web:0db7097a44e5f52a4d067a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Full Menu from your Image
  const MENU = [
    { id: "W01", name: "Bubur Kacang Hijau (Burjo)", price: 12000 },
    { id: "W02", name: "Burjo Ketan Hitam", price: 13000 },
    { id: "W03", name: "Indomie Goreng Original", price: 10000 },
    { id: "W04", name: "Indomie Goreng Telur", price: 14000 },
    { id: "W05", name: "Indomie Rebus Soto Telur", price: 14000 },
    { id: "W06", name: "Roti Bakar Coklat Keju", price: 15000 },
    { id: "W07", name: "Pisang Bakar Coklat Keju", price: 15000 },
    { id: "W08", name: "Es Kopi Susu Aren", price: 18000 },
    { id: "W09", name: "Es Kopi Hitam / Americano", price: 15000 },
    { id: "W10", name: "Es Teh Manis", price: 6000 },
    { id: "W11", name: "Es Jeruk Peras", price: 12000 }
  ];

  const cart = {};

  const menuEl = document.getElementById("menu");
  const cartBar = document.getElementById("cartBar");
  const viewCartBtn = document.getElementById("viewCartBtn");
  const cartModal = document.getElementById("cartModal");
  const closeCartBtn = document.getElementById("closeCartBtn");
  const cartItemsEl = document.getElementById("cartItems");
  const confirmOrderBtn = document.getElementById("confirmOrderBtn");
  const successScreen = document.getElementById("successScreen");

  function renderMenu() {
    menuEl.innerHTML = "";
    MENU.forEach(item => {
      const qty = cart[item.id] || 0;
      menuEl.innerHTML += `
        <div class="item">
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">Rp ${item.price.toLocaleString("id-ID")}</div>
          </div>
          <div class="qty-controls" data-id="${item.id}">
            ${qty > 0 ? `<button class="qty-btn" data-action="dec">−</button><span class="qty-num">${qty}</span>` : ""}
            <button class="qty-btn add" data-action="inc">+</button>
          </div>
        </div>
      `;
    });
  }

  function renderCartModal() {
    cartItemsEl.innerHTML = "";
    MENU.forEach(item => {
      const qty = cart[item.id] || 0;
      if (qty > 0) {
        cartItemsEl.innerHTML += `
          <div class="item" style="margin-bottom: 10px;">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">Rp ${(item.price * qty).toLocaleString("id-ID")}</div>
            </div>
            <div class="qty-controls" data-id="${item.id}">
              <button class="qty-btn" data-action="dec">−</button>
              <span class="qty-num">${qty}</span>
              <button class="qty-btn add" data-action="inc">+</button>
            </div>
          </div>
        `;
      }
    });
  }

  function updateCart() {
    let count = 0, amount = 0;
    for (const id in cart) {
      const item = MENU.find(m => m.id === id);
      if (cart[id] > 0) { count += cart[id]; amount += cart[id] * item.price; }
    }
    document.getElementById("cartCount").innerText = `${count} item`;
    document.getElementById("cartTotal").innerText = `Rp ${amount.toLocaleString("id-ID")}`;
    cartBar.style.display = count > 0 ? "flex" : "none";
    if (count === 0) cartModal.classList.remove("show");
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.closest(".qty-controls").dataset.id;
    if (btn.dataset.action === "inc") { cart[id] = (cart[id] || 0) + 1; }
    if (btn.dataset.action === "dec") { cart[id] = Math.max(0, cart[id] - 1); }
    renderMenu();
    updateCart();
    if (cartModal.classList.contains("show")) renderCartModal();
  });

  viewCartBtn.addEventListener("click", () => {
    renderCartModal();
    cartModal.classList.add("show");
  });
  closeCartBtn.addEventListener("click", () => cartModal.classList.remove("show"));

  confirmOrderBtn.addEventListener("click", async () => {
    let total = 0;
    const items = [];
    for (const id in cart) {
      if (cart[id] > 0) {
        const m = MENU.find(x => x.id === id);
        items.push({ name: m.name, qty: cart[id], price: m.price });
        total += m.price * cart[id];
      }
    }
    
    confirmOrderBtn.innerText = "Mengirim...";
    try {
      const ref = await db.ref("orders").push({
        items: items,
        total: total,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      cartModal.classList.remove("show");
      successScreen.classList.add("show");
      document.getElementById("successTotal").innerText = `Total: Rp ${total.toLocaleString("id-ID")}`;
      
      document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=WarkopBrmanoPayment_Total_${total}`;
    } catch (err) {
      alert("Error sending order!");
      confirmOrderBtn.innerText = "Send Order to Kitchen";
    }
  });

  newOrderBtn.addEventListener("click", () => {
    for (const k in cart) delete cart[k];
    renderMenu(); updateCart();
    successScreen.classList.remove("show");
    confirmOrderBtn.innerText = "Send Order to Kitchen";
  });

  renderMenu();
</script>
</body>
</html>
