<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen - Warkop Brmano</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #ffffff; padding: 20px; margin: 0; }
  header { border-bottom: 2px solid #f97316; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  h1 { color: #f97316; margin: 0; font-size: 24px;}
  
  .layout-container { display: flex; flex-direction: column; gap: 30px; }
  
  .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .order-card { background: #1e293b; border-radius: 12px; padding: 20px; border-left: 6px solid #f97316; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 15px; }
  .time { font-size: 13px; color: #cbd5e1; font-weight: bold;}
  .total-price { font-size: 14px; color: #4ade80; font-weight: bold; }
  
  /* Desain Info Pelanggan */
  .customer-info { background: #0f172a; padding: 10px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
  .customer-info p { margin: 0 0 4px 0; font-size: 14px; color: #cbd5e1; }
  .customer-info strong { color: #fff; font-size: 15px;}
  
  .item-list { list-style: none; padding: 0; margin: 0 0 15px 0; }
  .item-list li { font-size: 18px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; }
  .qty { font-weight: bold; color: #121212; background: #f97316; padding: 2px 8px; border-radius: 6px; font-size: 16px; }
  .item-name { flex: 1; line-height: 1.3;}
  
  .order-notes { background: rgba(234, 179, 8, 0.15); border-left: 4px solid #eab308; color: #fde047; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-style: italic;}
  .complete-btn { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  
  .summary-card { background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); overflow-x: auto;}
  .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #334155; padding-bottom: 12px; flex-wrap: wrap; gap: 10px;}
  .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; min-width: 700px;}
  .summary-table th, .summary-table td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; font-size: 14px;}
  .summary-table th { color: #f97316; font-weight: 600; }
  .export-btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Kitchen Display System</h1>
    <div style="color: #cbd5e1; font-size: 14px; margin-top: 4px;">Live Orders & Database Pelanggan - Warkop Brmano</div>
  </div>
</header>

<div class="layout-container">
  <div>
    <h2 style="font-size: 18px; color: #f97316; margin-bottom: 14px;">🎯 Pesanan Aktif</h2>
    <div class="order-grid" id="orderGrid">
      <div class="empty-state">Menunggu pesanan masuk...</div>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-header">
      <h2 style="font-size: 18px; margin: 0; color: #4ade80;">📈 Database Pesanan Hari Ini</h2>
      <button class="export-btn" onclick="exportToExcel()">📊 Export Data (.csv)</button>
    </div>
    <table class="summary-table">
      <thead>
        <tr>
          <th style="width: 50px;">No.</th>
          <th style="width: 100px;">Waktu</th>
          <th style="width: 150px;">Pelanggan</th>
          <th>Rincian Pesanan</th>
          <th style="width: 120px;">Total</th>
        </tr>
      </thead>
      <tbody id="summaryBody">
        <tr>
          <td colspan="5" class="empty-state">Belum ada pesanan yang diselesaikan.</td>
        </tr>
      </tbody>
    </table>
    <h3 style="text-align: right; font-size: 18px; color: #4ade80;" id="grandTotalText">Total Omset: Rp 0</h3>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCmmIeOR8RA-PeGZGVttAcdwHuPveuXVVM",
    authDomain: "order-sekarang.firebaseapp.com",
    databaseURL: "https://order-sekarang-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "order-sekarang",
    storageBucket: "order-sekarang.firebasestorage.app",
    messagingSenderId: "559153338639",
    appId: "1:559153338639:web:0db7097a44e5f52a4d067a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  const orderGrid = document.getElementById("orderGrid");
  const summaryBody = document.getElementById("summaryBody");
  const grandTotalText = document.getElementById("grandTotalText");

  const todayStr = new Date().toISOString().split('T')[0];
  let completedOrdersList = []; 
  let currentGrandTotal = 0;

  db.ref("orders").on("value", (snapshot) => {
    orderGrid.innerHTML = "";
    if (!snapshot.exists()) {
      orderGrid.innerHTML = '<div class="empty-state">Belum ada pesanan aktif.</div>';
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const key = childSnapshot.key;
      const order = childSnapshot.val();
      
      const cName = order.customerName || "Tanpa Nama";
      const cWA = order.customerWA || "-";

      let itemsHTML = "";
      if (order.items) {
        order.items.forEach(item => {
          itemsHTML += `<li><span class="qty">${item.qty}x</span> <span class="item-name">${item.name}</span></li>`;
        });
      }

      let notesHTML = "";
      if (order.notes && order.notes.trim() !== "") {
        notesHTML = `<div class="order-notes">📌 Catatan: ${order.notes}</div>`;
      }

      let dateTimeString = "Baru saja";
      if (order.timestamp) {
        const oDate = new Date(order.timestamp);
        dateTimeString = oDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
      
      const totalPrice = order.total ? `Rp ${order.total.toLocaleString("id-ID")}` : "";

      orderGrid.innerHTML += `
        <div class="order-card">
          <div class="order-header">
            <span class="time">🕒 ${dateTimeString}</span>
            <span class="total-price">${totalPrice}</span>
          </div>
          <div class="customer-info">
            <p>👤 <strong>${cName}</strong></p>
            <p>📞 ${cWA}</p>
          </div>
          <ul class="item-list">${itemsHTML}</ul>
          ${notesHTML}
          <button class="complete-btn" onclick="completeOrder('${key}')">Selesai & Rekap</button>
        </div>
      `;
    });
  });

  window.completeOrder = function(key) {
    if(confirm("Pesanan ini sudah selesai?")) {
      db.ref("orders/" + key).once("value", (snapshot) => {
        if(snapshot.exists()) {
          const orderData = snapshot.val();
          db.ref("completed_orders/" + todayStr + "/" + key).set(orderData, () => {
            db.ref("orders/" + key).remove();
          });
        }
      });
    }
  };

  db.ref("completed_orders/" + todayStr).on("value", (snapshot) => {
    summaryBody.innerHTML = "";
    completedOrdersList = [];
    currentGrandTotal = 0;
    let orderNumber = 1;

    if (!snapshot.exists()) {
      summaryBody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada pesanan selesai hari ini.</td></tr>';
      grandTotalText.innerText = "Total Omset: Rp 0";
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const order = childSnapshot.val();
      const cName = order.customerName || "Tanpa Nama";
      const cWA = order.customerWA || "-";
      
      let detailItems = [];
      if (order.items) {
        order.items.forEach(item => { detailItems.push(`${item.qty}x ${item.name}`); });
      }
      let detailString = detailItems.join(", ");
      if (order.notes && order.notes.trim() !== "") { detailString += ` (Catatan: ${order.notes})`; }
      
      let timeString = "-";
      if (order.timestamp) {
        const oDate = new Date(order.timestamp);
        timeString = oDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
      
      let totalHarga = order.total || 0;
      currentGrandTotal += totalHarga;

      completedOrdersList.push({
        no: orderNumber, waktu: timeString, nama: cName, wa: cWA, rincian: detailString, total: totalHarga
      });

      summaryBody.innerHTML += `
        <tr>
          <td><strong>#${orderNumber}</strong></td>
          <td>${timeString}</td>
          <td><strong>${cName}</strong><br><span style="font-size:12px;color:#94a3b8;">${cWA}</span></td>
          <td>${detailString}</td>
          <td style="color: #4ade80; font-weight: bold;">Rp ${totalHarga.toLocaleString("id-ID")}</td>
        </tr>
      `;
      orderNumber++;
    });

    grandTotalText.innerText = `Total Omset: Rp ${currentGrandTotal.toLocaleString("id-ID")}`;
  });

  window.exportToExcel = function() {
    if (completedOrdersList.length === 0) { alert("Tidak ada data untuk di-export!"); return; }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "DATABASE PELANGGAN & PESANAN WARKOP BRMANO\n";
    csvContent += `Tanggal: ${todayStr}\n\n`;
    csvContent += "No. Order,Waktu,Nama Pelanggan,No. WhatsApp,Rincian Pesanan,Total Harga\n";

    completedOrdersList.forEach(order => {
      let amanRincian = `"${order.rincian}"`; 
      csvContent += `${order.no},${order.waktu},"${order.nama}","${order.wa}",${amanRincian},${order.total}\n`;
    });
    
    csvContent += `\n,,,,,TOTAL OMSET HARIAN,${currentGrandTotal}\n`;

    const encodedUri = encodeURI(csvContent);
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", encodedUri);
    downloadAnchor.setAttribute("download", `Database_WarkopBrmano_${todayStr}.csv`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    document.body.removeChild(downloadAnchor);
  };
</script>
</body>
</html>
