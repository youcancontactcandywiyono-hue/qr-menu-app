<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen - Warkop Brmano</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
    background: #121212; 
    color: #ffffff; 
    padding: 20px; 
    margin: 0;
  }
  header { 
    border-bottom: 2px solid #f97316; 
    padding-bottom: 15px; 
    margin-bottom: 25px; 
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { color: #f97316; margin: 0; font-size: 24px;}
  .subtitle { color: #aaa; font-size: 14px; margin-top: 4px; }
  
  .order-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
    gap: 20px; 
  }
  .order-card { 
    background: #1e1e1e; 
    border-radius: 12px; 
    padding: 20px; 
    border-left: 6px solid #f97316; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 12px;
    margin-bottom: 15px;
  }
  .time { font-size: 14px; color: #aaa; font-weight: bold;}
  .total-price { font-size: 14px; color: #2fa86b; font-weight: bold; }
  
  .item-list { list-style: none; padding: 0; margin: 0 0 25px 0; }
  .item-list li { 
    font-size: 18px; 
    margin-bottom: 12px; 
    display: flex; 
    align-items: flex-start;
    gap: 12px;
  }
  .qty { 
    font-weight: bold; 
    color: #121212; 
    background: #f97316;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 16px;
  }
  .item-name { flex: 1; line-height: 1.3;}
  
  .complete-btn { 
    width: 100%; 
    padding: 16px; 
    background: #2fa86b; 
    color: white; 
    border: none; 
    border-radius: 8px; 
    font-size: 16px; 
    font-weight: bold; 
    cursor: pointer; 
    transition: background 0.2s;
  }
  .complete-btn:hover { background: #248554; }
  .complete-btn:active { transform: scale(0.98); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px;
    color: #666;
    font-size: 18px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Kitchen Display System</h1>
    <div class="subtitle">Live Orders - Warkop Brmano</div>
  </div>
</header>

<div class="order-grid" id="orderGrid">
  <div class="empty-state">Menunggu pesanan masuk...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // Firebase Config (Pre-filled for you)
  const firebaseConfig = {
    apiKey: "AIzaSyCmmIeOR8RA-PeGZGVttAcdwHuPveuXVVM",
    authDomain: "order-sekarang.firebaseapp.com",
    databaseURL: "https://order-sekarang-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "order-sekarang",
    storageBucket: "order-sekarang.firebasestorage.app",
    messagingSenderId: "559153338639",
    appId: "1:559153338639:web:0db7097a44e5f52a4d067a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const orderGrid = document.getElementById("orderGrid");

  // Listen for new orders in real-time
  db.ref("orders").on("value", (snapshot) => {
    orderGrid.innerHTML = ""; // Clear grid
    
    if (!snapshot.exists()) {
      orderGrid.innerHTML = '<div class="empty-state">Belum ada pesanan aktif.</div>';
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const key = childSnapshot.key;
      const order = childSnapshot.val();
      
      // Build the list of items
      let itemsHTML = "";
      if (order.items) {
        order.items.forEach(item => {
          itemsHTML += `
            <li>
              <span class="qty">${item.qty}x</span> 
              <span class="item-name">${item.name}</span>
            </li>`;
        });
      }

      // Format the time safely
      let timeString = "Baru saja";
      if (order.timestamp) {
        timeString = new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
      
      // Format the total price
      const totalPrice = order.total ? `Rp ${order.total.toLocaleString("id-ID")}` : "";

      orderGrid.innerHTML += `
        <div class="order-card">
          <div class="order-header">
            <span class="time">Masuk: ${timeString}</span>
            <span class="total-price">${totalPrice}</span>
          </div>
          <ul class="item-list">
            ${itemsHTML}
          </ul>
          <button class="complete-btn" onclick="completeOrder('${key}')">Selesai (Hapus Pesanan)</button>
        </div>
      `;
    });
  });

  // Delete the order when "Selesai" is clicked
  window.completeOrder = function(key) {
    if(confirm("Apakah pesanan ini sudah selesai dan siap disajikan?")) {
      db.ref("orders/" + key).remove();
    }
  };
</script>
</body>
</html>
