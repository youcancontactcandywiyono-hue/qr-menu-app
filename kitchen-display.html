<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen - Warkop Brmano</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #ffffff; padding: 20px; margin: 0; }
  header { border-bottom: 2px solid #f97316; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
  h1 { color: #f97316; margin: 0; font-size: 24px;}
  
  .layout-container { display: flex; flex-direction: column; gap: 30px; }
  
  .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .order-card { background: #1e293b; border-radius: 12px; padding: 20px; border-left: 6px solid #f97316; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 15px; }
  .time { font-size: 13px; color: #cbd5e1; font-weight: bold;}
  .total-price { font-size: 14px; color: #4ade80; font-weight: bold; }
  
  .item-list { list-style: none; padding: 0; margin: 0 0 25px 0; }
  .item-list li { font-size: 18px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px; }
  .qty { font-weight: bold; color: #121212; background: #f97316; padding: 2px 8px; border-radius: 6px; font-size: 16px; }
  .item-name { flex: 1; line-height: 1.3;}
  
  .complete-btn { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  
  /* Panel Summary Hari Ini */
  .summary-card { background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #334155; padding-bottom: 12px;}
  .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  .summary-table th, .summary-table td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
  .summary-table th { color: #f97316; font-weight: 600; }
  .export-btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .export-btn:hover { background: #2563eb; }

  .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 16px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Kitchen Display System</h1>
    <div style="color: #cbd5e1; font-size: 14px; margin-top: 4px;">Live Orders & Rekap - Warkop Brmano</div>
  </div>
</header>

<div class="layout-container">
  <div>
    <h2 style="font-size: 18px; color: #f97316; margin-bottom: 14px;">🎯 Pesanan Aktif (Belum Selesai)</h2>
    <div class="order-grid" id="orderGrid">
      <div class="empty-state">Menunggu pesanan masuk...</div>
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-header">
      <h2 style="font-size: 18px; margin: 0; color: #4ade80;">📈 Ringkasan Penjualan Hari Ini</h2>
      <button class="export-btn" onclick="exportToExcel()">📊 Export ke Excel (.csv)</button>
    </div>
    <table class="summary-table">
      <thead>
        <tr>
          <th>Nama Menu</th>
          <th>Total Porsi Terjual</th>
          <th>Subtotal Pendapatan</th>
        </tr>
      </thead>
      <tbody id="summaryBody">
        <tr>
          <td colspan="3" class="empty-state">Belum ada pesanan yang diselesaikan hari ini.</td>
        </tr>
      </tbody>
    </table>
    <h3 style="text-align: right; font-size: 18px; color: #4ade80;" id="grandTotalText">Total Omset Harian: Rp 0</h3>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCmmIeOR8RA-PeGZGVttAcdwHuPveuXVVM",
    authDomain: "order-sekarang.firebaseapp.com",
    databaseURL: "https://order-sekarang-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "order-sekarang",
    storageBucket: "order-sekarang.firebasestorage.app",
    messagingSenderId: "559153338639",
    appId: "1:559153338639:web:0db7097a44e5f52a4d067a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  const orderGrid = document.getElementById("orderGrid");
  const summaryBody = document.getElementById("summaryBody");
  const grandTotalText = document.getElementById("grandTotalText");

  // Dapatkan String Tanggal Hari Ini (WIB/Lokal) format YYYY-MM-DD
  const todayStr = new Date().toISOString().split('T')[0];
  let dailySummaryData = {}; 
  let currentGrandTotal = 0;

  // 1. DENGARKAN ORDER MASUK (AKTIF)
  db.ref("orders").on("value", (snapshot) => {
    orderGrid.innerHTML = "";
    if (!snapshot.exists()) {
      orderGrid.innerHTML = '<div class="empty-state">Belum ada pesanan aktif.</div>';
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const key = childSnapshot.key;
      const order = childSnapshot.val();
      
      let itemsHTML = "";
      if (order.items) {
        order.items.forEach(item => {
          itemsHTML += `<li><span class="qty">${item.qty}x</span> <span class="item-name">${item.name}</span></li>`;
        });
      }

      // Tampilkan Tanggal dan Jam Masuk Pesanan Sesuai Permintaan
      let dateTimeString = "Baru saja";
      if (order.timestamp) {
        const oDate = new Date(order.timestamp);
        dateTimeString = oDate.toLocaleDateString('id-ID', {day: 'numeric', month: 'short'}) + " - " + oDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
      
      const totalPrice = order.total ? `Rp ${order.total.toLocaleString("id-ID")}` : "";

      orderGrid.innerHTML += `
        <div class="order-card">
          <div class="order-header">
            <span class="time">🕒 ${dateTimeString}</span>
            <span class="total-price">${totalPrice}</span>
          </div>
          <ul class="item-list">${itemsHTML}</ul>
          <button class="complete-btn" onclick="completeOrder('${key}')">Selesai & Rekap</button>
        </div>
      `;
    });
  });

  // 2. FUNGSI KLIK SELESAI (Pindahkan order aktif ke riwayat hari ini)
  window.completeOrder = function(key) {
    if(confirm("Selesaikan pesanan ini? Selesai akan otomatis merekap total harian.")) {
      db.ref("orders/" + key).once("value", (snapshot) => {
        if(snapshot.exists()) {
          const orderData = snapshot.val();
          // Simpan ke folder riwayat hari ini agar aman & ringan
          db.ref("completed_orders/" + todayStr + "/" + key).set(orderData, () => {
            // Hapus dari folder antrean aktif dapur
            db.ref("orders/" + key).remove();
          });
        }
      });
    }
  };

  // 3. DENGARKAN REKAP HARIAN HARI INI SAJA (Sangat Ringan)
  db.ref("completed_orders/" + todayStr).on("value", (snapshot) => {
    summaryBody.innerHTML = "";
    dailySummaryData = {};
    currentGrandTotal = 0;

    if (!snapshot.exists()) {
      summaryBody.innerHTML = '<tr><td colspan="3" class="empty-state">Belum ada pesanan selesai hari ini.</td></tr>';
      grandTotalText.innerText = "Total Omset Hari Ini: Rp 0";
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const order = childSnapshot.val();
      if (order.items) {
        order.items.forEach(item => {
          if (!dailySummaryData[item.name]) {
            dailySummaryData[item.name] = { qty: 0, revenue: 0 };
          }
          dailySummaryData[item.name].qty += item.qty;
          dailySummaryData[item.name].revenue += (item.qty * item.price);
        });
      }
      if(order.total) { currentGrandTotal += order.total; }
    });

    // Render ke Tabel Ringkasan
    for (const menuName in dailySummaryData) {
      summaryBody.innerHTML += `
        <tr>
          <td><strong>${menuName}</strong></td>
          <td>${dailySummaryData[menuName].qty} Porsi</td>
          <td>Rp ${dailySummaryData[menuName].revenue.toLocaleString("id-ID")}</td>
        </tr>
      `;
    }
    grandTotalText.innerText = `Total Omset Hari Ini: Rp ${currentGrandTotal.toLocaleString("id-ID")}`;
  });

  // 4. FUNGSI EXPORT DATA KE EXCEL (CSV FORMAT)
  window.exportToExcel = function() {
    if (Object.keys(dailySummaryData).length === 0) {
      alert("Tidak ada data penjualan hari ini untuk di-export!");
      return;
    }

    // Buat header kolom tabel
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "REKAP PENJUALAN WARKOP BRMANO\n";
    csvContent += `Tanggal: ${todayStr}\n\n`;
    csvContent += "Nama Menu,Total Porsi Terjual,Subtotal Pendapatan\n";

    // Masukkan data baris menu
    for (const menuName in dailySummaryData) {
      csvContent += `"${menuName}",${dailySummaryData[menuName].qty},${dailySummaryData[menuName].revenue}\n`;
    }
    
    csvContent += `\n,,Total Omset Harian,${currentGrandTotal}\n`;

    // Trigger Download otomatis di browser
    const encodedUri = encodeURI(csvContent);
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", encodedUri);
    downloadAnchor.setAttribute("download", `Rekap_WarkopBrmano_${todayStr}.csv`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    document.body.removeChild(downloadAnchor);
  };
</script>
</body>
</html>
