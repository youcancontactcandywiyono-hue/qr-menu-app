<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitchen Display — Bistro Bloom</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --panel-2: #232a34;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #2d3540;
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.15);
    --green: #10b981;
    --green-dark: #059669;
    --red: #ef4444;
    --new: #3b82f6;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--panel);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .left {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  header .brand {
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  header .right {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s ease;
  }
  .status.online .dot {
    background: var(--green);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
  }
  .status.error .dot { background: var(--red); }

  .counter {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--muted);
    font-size: 14px;
  }

  main {
    padding: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  /* Ticket */
  .ticket {
    background: var(--panel);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    animation: slideIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .ticket.removing {
    opacity: 0;
    transform: scale(0.95);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ticket-head {
    background: var(--panel-2);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .ticket-id {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .ticket-time {
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .ticket.fresh .ticket-time {
    background: rgba(59, 130, 246, 0.15);
    color: var(--new);
  }
  .ticket.aging .ticket-time {
    background: rgba(239, 68, 68, 0.15);
    color: var(--red);
  }

  .ticket-body {
    padding: 14px 16px;
    flex: 1;
  }
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .qty {
    background: var(--accent);
    color: #0f1419;
    font-weight: 700;
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }
  .item-row .name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    padding-top: 5px;
  }

  .ticket-foot {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ticket-total {
    font-size: 13px;
    color: var(--muted);
  }
  .ticket-total b {
    color: var(--text);
    font-weight: 700;
    margin-left: 4px;
  }
  .complete-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .complete-btn:hover { background: var(--green-dark); }
  .complete-btn:active { transform: scale(0.96); }
  .complete-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .complete-btn svg { width: 14px; height: 14px; }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    padding: 80px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty .icon {
    font-size: 48px;
    margin-bottom: 14px;
    opacity: 0.5;
  }
  .empty h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .empty p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--panel-2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.error { border-color: var(--red); }

  @media (max-width: 600px) {
    main { padding: 14px; }
    header { padding: 14px 16px; }
    header h1 { font-size: 18px; }
    header .right { gap: 12px; }
    .clock { display: none; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <span class="brand">Bistro Bloom</span>
    <h1>Kitchen Display</h1>
  </div>
  <div class="right">
    <span class="counter" id="counter">0 active</span>
    <span class="clock" id="clock">—</span>
    <span class="status" id="status">
      <span class="dot"></span>
      <span class="label">Connecting…</span>
    </span>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty" id="empty">
      <div class="icon">🍽️</div>
      <h2>No active orders</h2>
      <p>New tickets will appear here as they come in.</p>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // ===== Firebase config =====
  // IMPORTANT: must match the config used in the customer ordering app
  // so both connect to the same Realtime Database.
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ordersRef = db.ref("orders");

  // ===== DOM refs =====
  const grid = document.getElementById("grid");
  const emptyEl = document.getElementById("empty");
  const counterEl = document.getElementById("counter");
  const statusEl = document.getElementById("status");
  const statusLabel = statusEl.querySelector(".label");
  const clockEl = document.getElementById("clock");
  const toastEl = document.getElementById("toast");

  // ===== Local cache of tickets in the DOM =====
  // key -> { el, createdAt }
  const tickets = new Map();

  // ===== Helpers =====
  function setStatus(state, msg) {
    statusEl.classList.remove("online", "error");
    if (state) statusEl.classList.add(state);
    statusLabel.textContent = msg;
  }

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2800);
  }

  function updateCounter() {
    const n = tickets.size;
    counterEl.textContent = `${n} active`;
    emptyEl.style.display = n === 0 ? "block" : "none";
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function ageMinutes(ts) {
    return Math.floor((Date.now() - ts) / 60000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function renderTicket(key, order) {
    const ts = typeof order.timestamp === "number"
      ? order.timestamp
      : (order.createdAt ? Date.parse(order.createdAt) : Date.now());

    const el = document.createElement("div");
    el.className = "ticket fresh";
    el.dataset.key = key;
    el.dataset.ts = ts;

    const itemsHtml = (order.items || []).map(it => `
      <div class="item-row">
        <div class="qty">${it.qty || 1}×</div>
        <div class="name">${escapeHtml(it.name || "Item")}</div>
      </div>
    `).join("");

    const total = typeof order.total === "number"
      ? `$${order.total.toFixed(2)}`
      : "—";

    el.innerHTML = `
      <div class="ticket-head">
        <span class="ticket-id">#${key.slice(-6).toUpperCase()}</span>
        <span class="ticket-time" data-ts="${ts}">${formatTime(ts)}</span>
      </div>
      <div class="ticket-body">
        ${itemsHtml || '<div class="item-row"><div class="name" style="color:var(--muted)">No items</div></div>'}
      </div>
      <div class="ticket-foot">
        <span class="ticket-total">Total <b>${total}</b></span>
        <button class="complete-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Complete
        </button>
      </div>
    `;

    el.querySelector(".complete-btn").addEventListener("click", () => completeOrder(key, el));
    applyAgeClass(el, ts);
    return el;
  }

  function applyAgeClass(el, ts) {
    const mins = ageMinutes(ts);
    el.classList.remove("fresh", "aging");
    if (mins < 1) el.classList.add("fresh");
    else if (mins >= 8) el.classList.add("aging");
  }

  function insertSorted(el, ts) {
    // Insert newest first (descending by ts)
    const existing = [...grid.querySelectorAll(".ticket")];
    const insertBefore = existing.find(n => Number(n.dataset.ts) < ts);
    if (insertBefore) grid.insertBefore(el, insertBefore);
    else grid.insertBefore(el, emptyEl); // append before the empty placeholder
  }

  async function completeOrder(key, el) {
    const btn = el.querySelector(".complete-btn");
    btn.disabled = true;
    try {
      await ordersRef.child(key).remove();
      // The child_removed listener will handle DOM cleanup.
    } catch (err) {
      console.error("Failed to complete order:", err);
      showToast("Couldn't mark complete. Check connection.", true);
      btn.disabled = false;
    }
  }

  function removeTicket(key) {
    const entry = tickets.get(key);
    if (!entry) return;
    entry.el.classList.add("removing");
    setTimeout(() => {
      entry.el.remove();
      tickets.delete(key);
      updateCounter();
    }, 280);
  }

  // ===== Firebase listeners =====
  ordersRef.on("child_added", (snap) => {
    const key = snap.key;
    const order = snap.val() || {};
    if (tickets.has(key)) return;

    const el = renderTicket(key, order);
    const ts = Number(el.dataset.ts);
    insertSorted(el, ts);
    tickets.set(key, { el, ts });
    updateCounter();
  }, (err) => {
    console.error("Listener error:", err);
    setStatus("error", "Connection error");
    showToast("Couldn't connect to Firebase. Check config.", true);
  });

  ordersRef.on("child_removed", (snap) => {
    removeTicket(snap.key);
  });

  // Connection status indicator (Firebase has a special .info/connected node)
  db.ref(".info/connected").on("value", (snap) => {
    if (snap.val() === true) setStatus("online", "Live");
    else setStatus(null, "Reconnecting…");
  });

  // ===== Ticking clock + ticket age refresh =====
  function tick() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString([], {
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    // Re-evaluate aging class every tick
    tickets.forEach(({ el, ts }) => applyAgeClass(el, ts));
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
